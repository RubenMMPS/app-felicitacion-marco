<div class="fondo-pagina">
  <div class="contenedor-principal">
    <div *ngIf="!isComplete" class="quiz-card">
      <div class="quiz-header">
        <span class="step-indicator">Pregunta {{ currentStepNumber }}/{{ totalQuestions }}</span>
        <h1 class="intro-titulo" *ngIf="currentStepNumber==1">{{ quizData.introTitle }}</h1>
      </div>

      <h2 class="pregunta">{{ currentQuestion.prompt }}</h2>

      <img
        *ngIf="currentQuestion.image"
        [src]="currentQuestion.image"
        alt="Pregunta adicional"
        class="question-image"
      />

      <div class="opciones">
        <button
          *ngFor="let option of currentQuestion.options"
          type="button"
          class="opcion"
          (click)="handleAnswer(option)"
        >
          {{ option.label }}
        </button>
      </div>

      <p
        *ngIf="feedbackMessage"
        class="mensaje"
        [ngClass]="{ 'mensaje-correcto': lastAnswerCorrect, 'mensaje-error': lastAnswerCorrect === false }"
      >
        {{ feedbackMessage }}
      </p>
    </div>

    <div *ngIf="isComplete" class="felicitacion-circular">
      <img src="assets/fotos/foto7.jpg" alt="Amigo" class="foto foto1" />
      <img src="assets/fotos/foto6.jpg" alt="Amigo" class="foto foto2" />
      <img src="assets/fotos/foto2.jpg" alt="Amigo" class="foto foto3" />
      <img src="assets/fotos/foto1.jpg" alt="Amigo" class="foto foto4" />
      <img src="assets/fotos/foto4.jpg" alt="Amigo" class="foto foto5" />
      <img src="assets/fotos/foto3.jpg" alt="Amigo" class="foto foto6" />

      <div class="nota-central">
        <h1 class="felicitacion-titulo">{{ quizData.final.title }}</h1>
        <p class="felicitacion-texto">{{ quizData.final.text }}</p>
      </div>
    </div>
  </div>
</div>
